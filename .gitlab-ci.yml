image: node:22

stages:
  - checks

variables:
  BROWSERSLIST_IGNORE_OLD_DATA: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  SLOW_QUERY_REPORT_CUTOFF_MS: "-1"

lint:
  stage: checks
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn run eslint

typecheck:
  stage: checks
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn run tsc

unit-tests:
  stage: checks
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn run unit-ci

integration-tests:
  stage: checks
  services:
    - name: ankane/pgvector
      alias: postgres
      variables:
        POSTGRES_DB: unittest_jest_template
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    PG_URL: postgres://postgres:postgres@postgres:5432/postgres
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn create-integration-db-ci
    - yarn run integration-ci
