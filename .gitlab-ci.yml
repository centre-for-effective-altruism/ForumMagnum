image: node:22

stages:
  - checks

variables:
  BROWSERSLIST_IGNORE_OLD_DATA: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  SLOW_QUERY_REPORT_CUTOFF_MS: "-1"

lint:
  stage: checks
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn run eslint

typecheck:
  stage: checks
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn run tsc

unit-tests:
  stage: checks
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn run unit-ci

integration-tests:
  stage: checks
  services:
    - name: ankane/pgvector
      alias: postgres
      variables:
        POSTGRES_DB: unittest_jest_template
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    PG_URL: postgres://postgres:postgres@postgres:5432/postgres
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - yarn create-integration-db-ci
    - yarn run integration-ci

playwright:
  stage: checks
  services:
    - name: ankane/pgvector
      alias: postgres
      variables:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
  variables:
    PG_URL: postgres://postgres:password@postgres:5432/postgres
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - psql postgres://postgres:password@postgres:5432/postgres -f schema/accepted_schema.sql
    - psql postgres://postgres:password@postgres:5432/postgres -f playwright/fixtures.sql
    - yarn playwright install chromium --with-deps
    - yarn playwright test --project chromium

crosspost-tests:
  stage: checks
  services:
    - name: ankane/pgvector
      alias: postgres-local
      variables:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
    - name: ankane/pgvector
      alias: postgres-foreign
      variables:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - corepack enable
    - yarn install --frozen-lockfile
  script:
    - psql postgres://postgres:password@postgres-local:5432/postgres -f schema/accepted_schema.sql
    - psql postgres://postgres:password@postgres-local:5432/postgres -f playwright/fixtures.sql
    - psql postgres://postgres:password@postgres-foreign:5432/postgres -f schema/accepted_schema.sql
    - psql postgres://postgres:password@postgres-foreign:5432/postgres -f playwright/fixtures.sql
    - yarn playwright install chromium --with-deps
    - yarn playwright-test-crosspost
